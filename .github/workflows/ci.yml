name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=normal"

      - name: Build app (x64, unpackaged)
        run: dotnet build src/NeoContext.App --configuration Release -p:Platform=x64 -p:WindowsPackageType=None
