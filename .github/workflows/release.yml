name: Release

# Push a tag such as v0.2.0 to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      # Optional signing: store a base64-encoded .pfx in the SIGNING_CERTIFICATE secret and its
      # password in SIGNING_CERTIFICATE_PASSWORD. Without them the MSIX is built unsigned.
      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          CERT: ${{ secrets.SIGNING_CERTIFICATE }}
        run: |
          if ($env:CERT) {
            $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT))
            "path=$path" >> $env:GITHUB_OUTPUT
          }

      - name: Build artifacts
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $params = @{ Version = $version }
          if ('${{ steps.cert.outputs.path }}') {
            $params.CertificatePath = '${{ steps.cert.outputs.path }}'
            $params.CertificatePassword = $env:CERT_PASSWORD
          }
          ./build/Publish.ps1 @params

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' artifacts/*.zip artifacts/*.msix artifacts/SHA256SUMS.txt `
            --title "NeoContext ${{ github.ref_name }}" --generate-notes
